name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: GITHUB_PAGES=1 NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build
      - name: Keep previous hashed assets
        run: |
          if git clone -q --depth 1 -b gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/old 2>/dev/null && [ -d /tmp/old/_next/static ]; then
            mkdir -p out/_next/static && cp -Rn /tmp/old/_next/static/. out/_next/static/ || true
          fi
          touch out/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Deploy static site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
